packages:
  - apps/*
  - packages/agent-planning
  - packages/lark
  - packages/ocr
  - packages/ooxml
verifyDepsBeforeRun: false
shamefullyHoist: true
strictPeerDependencies: false
allowUnusedPatches: true
allowBuilds:
  '@biomejs/biome': true
  '@nestjs/core': true
  '@scarf/scarf': false
  '@swc/core': true
  core-js: true
  cpu-features: false
  msgpackr-extract: true
  protobufjs: true
  ssh2: true
  vue-demi: true
patchedDependencies:
  '@univerjs/slides-ui@0.24.0': patches/@univerjs__slides-ui@0.24.0.patch
