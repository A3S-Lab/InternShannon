name: Pull Request Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  knowledge-and-web:
    name: Knowledge sidecar and desktop web
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check sidecar DDD boundaries
        run: pnpm --filter @internshannon/sidecar run ddd:check

      - name: Check single SDK compaction engine architecture
        run: pnpm --filter @internshannon/sidecar run compact:architecture-check

      - name: Test knowledge and OKF workflows
        run: |
          pnpm --filter @internshannon/sidecar exec jest --runInBand \
            src/modules/assets/domain/knowledge/open-knowledge-format.spec.ts \
            src/modules/assets/application/knowledge-ingestion.service.spec.ts \
            src/modules/assets/application/knowledge-query.service.spec.ts \
            src/modules/assets/application/knowledge-operations.service.spec.ts \
            src/modules/assets/application/knowledge-okf.service.spec.ts \
            src/modules/assets/presentation/controllers/desktop-assets.controller.spec.ts

      - name: Build sidecar
        run: pnpm --filter @internshannon/sidecar build

      - name: Test desktop web state
        run: pnpm --filter @internshannon/web run desktop:state-test

      - name: Build desktop web
        run: pnpm --filter @internshannon/web run workspace:build
